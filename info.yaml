# Tiny Tapeout project information
project:
  title:        "triple_t"      # Project title
  author:       "AzzyAzimuth"      # Your name
  discord:      "mr_eclipse"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "experimental ternary cpu"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     40000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "4x6"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4
  # analog_pins: 2
  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_triple_t_devEclipse2"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "main/tt_um_triple_t_devEclipse2.v"
    - "main/tt_um_core_commander.v"
    - "main/ternary_to_unsigned_binary_logic_convert_4t.v"
    - "main/logic_container.v"
    - "main/thread/microcode.v"
    - "main/thread/ternary_pc_4t.v"
    - "main/thread/ternary_pc_12t.v"
    - "main/thread/thread_command.v"
    - "main/alu/alu.v"
    - "main/alu/native_wrapper_sim.v" # fix later ah
    - "main/alu/simulated/bt_add_4t.v"
    - "main/alu/simulated/bt_add3_4t.v"
    - "main/alu/simulated/bt_fa_1t.v"
    - "main/alu/simulated/bt_fa3_1t.v"
    - "main/alu/simulated/bt_mul_4t.v"
    - "main/alu/simulated/tritwise_1.v"
    - "main/alu/simulated/tritwise_2.v"
    - "main/alu/simulated/tritwise_3.v"
  analog_pins: 0
# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "sub mux bit 0"
  ui[1]: "sub mux bit 1"
  ui[2]: "sub mux bit 2"
  ui[3]: "variable, see doc"
  ui[4]: "variable, see doc"
  ui[5]: "variable, see doc"
  ui[6]: "variable, see doc"
  ui[7]: "variable, see doc"

  # Outputs
  uo[0]: "variable, see doc"
  uo[1]: "variable, see doc"
  uo[2]: "variable, see doc"
  uo[3]: "variable, see doc"
  uo[4]: "variable, see doc"
  uo[5]: "variable, see doc"
  uo[6]: "variable, see doc"
  uo[7]: "variable, see doc"

  # Bidirectional pins
  uio[0]: "variable but mostly used as data bus 0"
  uio[1]: "variable but mostly used as data bus 1"
  uio[2]: "variable but mostly used as data bus 2"
  uio[3]: "variable but mostly used as data bus 3"
  uio[4]: "variable but mostly used as data bus 4"
  uio[5]: "variable but mostly used as data bus 5"
  uio[6]: "variable but mostly used as data bus 6"
  uio[7]: "variable but mostly used as data bus 7"
  #might not get em but fuh it 
  
  # ua[0]: "the singular power line. please take good care of it. thanks." #1.65v 
  # ua[1]: "spare one we keep in the boot" #1.65v
"CLOCK_PERIOD": 25,
"RUN_DESIGN_REPAIR": false,
"DESIGN_REPAIR_MAX_SLEW_PCT": 0,
"DESIGN_REPAIR_MAX_CAP_PCT": 0,
"HOLD_SLACK_MARGIN": 0.0,
"PL_RESIZER_HOLD_SLACK_MARGIN": 0.0,
"GRT_RESIZER_HOLD_SLACK_MARGIN": 0.0,
"PL_RESIZER_HOLD_MAX_BUFFER_PCT": 10,
"GRT_RESIZER_HOLD_MAX_BUFFER_PCT": 10
"DESIGN_REPAIR_MAX_WIRE_LENGTH": 0,
"RSZ_DONT_TOUCH_RX": ".*clk.*|.*rst.*"
# Do not change!
yaml_version: 6
